# =============================================================================
# Configuración de nginx para el frontend en Docker
# =============================================================================
# nginx actúa como servidor web para los ficheros estáticos de React
# y como proxy inverso para las peticiones al backend.
#
# Esto resuelve los problemas de CORS en producción: tanto el frontend
# como las peticiones a la API se sirven desde el mismo origen (puerto 80),
# así que el navegador no las considera cross-origin.
# =============================================================================

server {
    listen 80;
    server_name localhost;

    # --- Ficheros estáticos de React ---
    # root apunta al directorio donde Vite genera el build
    root /usr/share/nginx/html;
    index index.html;

    # --- Proxy al backend ---
    # Todas las peticiones a /api/* se reenvían al contenedor del backend.
    # "backend" es el nombre del servicio en docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Proxy a la consola H2 (útil para depuración) ---
    location /h2-console/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # --- SPA fallback ---
    # React usa client-side routing: si el usuario recarga /bola, nginx
    # debe devolver index.html (no buscar un fichero /bola en disco).
    # try_files intenta: 1) el fichero exacto, 2) un directorio, 3) index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
