# =============================================================================
# Configuración del backend — API Security Lab (TFM)
# =============================================================================
# Este fichero configura Spring Boot para el laboratorio.
# Todas las opciones están comentadas para poder explicarlas en la memoria.
# =============================================================================

# --- Nombre de la aplicación ---
spring.application.name=api-sec-lab

# --- Puerto del servidor ---
# Se usa 8080 (estándar para desarrollo). En Docker se mapeará al mismo puerto.
server.port=8080

# =============================================================================
# H2 — Base de datos en memoria
# =============================================================================
# jdbc:h2:mem:apiseclab → BD en RAM, sin fichero en disco.
# DB_CLOSE_DELAY=-1    → mantiene la BD viva mientras la JVM esté activa
#                         (sin esto, H2 la destruiría al cerrar la última conexión).
#
# Ventaja para el laboratorio: cada reinicio parte de un estado limpio con los
# datos semilla del DataInitializer. Esto garantiza reproducibilidad en las demos.
# =============================================================================
spring.datasource.url=jdbc:h2:mem:apiseclab;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =============================================================================
# JPA / Hibernate
# =============================================================================
# ddl-auto=create-drop → crea las tablas al arrancar y las borra al parar.
# En producción se usarían migraciones (Flyway/Liquibase), pero aquí queremos
# un esquema siempre fresco y alineado con las entidades Java.
#
# show-sql=true → imprime las queries SQL en consola (útil para depuración
# y para mostrar en la memoria cómo JPA traduce las operaciones).
# =============================================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# Consola web de H2
# =============================================================================
# Permite acceder a http://localhost:8080/h2-console para inspeccionar la BD
# directamente desde el navegador. Muy útil para verificar los datos semilla
# y para depurar durante el desarrollo.
#
# NOTA: en producción NUNCA se dejaría habilitada. Aquí es seguro porque
# la BD es efímera y los datos son de prueba.
# =============================================================================
spring.h2.console.enabled=false
#spring.h2.console.path=/h2-console
